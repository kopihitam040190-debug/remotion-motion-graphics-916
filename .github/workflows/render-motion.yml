name: Render Motion Graphics (Remotion + Natural Edge-TTS)

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Path skrip job Python relatif ke root repo"
        required: false
        default: "active_remotion_job.py"
        type: string
      release_tag:
        description: "Tag GitHub Release tujuan (kosongkan untuk otomatis)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - utama
    paths:
      - "active_remotion_job.py"
      - "jobs/active_remotion_job.py"

permissions:
  contents: write

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: false

env:
  WORK_ROOT_REL: ".remotion_work"
  CACHE_ROOT_REL: ".remotion_cache"
  OUTPUT_ROOT_REL: "outputs"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate Active Job File
        id: locate_job
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED_JOB="${{ github.event.inputs.job_path }}"
          CANDIDATES=()
          if [ -n "${REQUESTED_JOB}" ]; then
            CANDIDATES+=("${REQUESTED_JOB}")
          fi
          CANDIDATES+=("active_remotion_job.py" "jobs/active_remotion_job.py")

          SELECTED=""
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "${candidate}" ]; then
              SELECTED="${candidate}"
              break
            fi
          done

          if [ -z "${SELECTED}" ]; then
            echo "Error: Tidak ditemukan file job aktif (dicari: ${CANDIDATES[*]})." >&2
            exit 1
          fi

          JOB_HASH="$(sha256sum "${SELECTED}" | awk '{print substr($1, 1, 12)}')"
          echo "Menggunakan job: ${SELECTED} (hash: ${JOB_HASH})"
          {
            echo "job_file=${SELECTED}"
            echo "job_hash=${JOB_HASH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore Persistent Cache (Node, Chromium, Python TTS, APT)
        id: cache_restore
        uses: actions/cache@v4
        with:
          path: |
            .remotion_cache/npm
            .remotion_cache/node_template
            .remotion_cache/py_site
            .remotion_cache/chromium
          key: remotion-v3-${{ runner.os }}-node20-py311-${{ steps.locate_job.outputs.job_hash }}
          restore-keys: |
            remotion-v3-${{ runner.os }}-node20-py311-
            remotion-v3-${{ runner.os }}-

      - name: Install FFmpeg, System Fonts & Python Edge-TTS (If Cache Miss)
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${GITHUB_WORKSPACE}/${WORK_ROOT_REL}"
          CACHE_DIR="${GITHUB_WORKSPACE}/${CACHE_ROOT_REL}"
          PY_SITE="${CACHE_DIR}/py_site"
          NPM_CACHE="${CACHE_DIR}/npm"
          NODE_TPL="${CACHE_DIR}/node_template"
          CHROMIUM_CACHE="${CACHE_DIR}/chromium"
          CHROMIUM_RUNTIME="${RUNNER_TEMP:-/tmp}/remotion-chromium"
          OUT_DIR="${GITHUB_WORKSPACE}/${OUTPUT_ROOT_REL}"

          mkdir -p \
            "${WORK_DIR}" \
            "${CACHE_DIR}" \
            "${PY_SITE}" \
            "${NPM_CACHE}" \
            "${NODE_TPL}" \
            "${CHROMIUM_CACHE}" \
            "${CHROMIUM_RUNTIME}" \
            "${OUT_DIR}"

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || [ ! -d /usr/share/fonts/truetype/dejavu ]; then
            echo "[SETUP] Memasang ffmpeg, ffprobe, dan font sistem..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              ffmpeg \
              fonts-liberation \
              fonts-dejavu-core
          else
            echo "[SETUP] FFmpeg & font sistem sudah tersedia."
          fi

          if ! PYTHONPATH="${PY_SITE}" python3 -c "import edge_tts" >/dev/null 2>&1; then
            echo "[SETUP] Memasang paket Python (edge-tts, faster-whisper) ke ${PY_SITE}..."
            python3 -m pip install -q --upgrade --no-warn-script-location \
              --target "${PY_SITE}" \
              edge-tts \
              faster-whisper
          else
            echo "[SETUP] Cache Python edge-tts sudah tersedia."
          fi

      - name: Run Active Remotion Job
        shell: bash
        env:
          PYTHONPATH: "${{ github.workspace }}/.remotion_cache/py_site"
          NPM_CONFIG_CACHE: "${{ github.workspace }}/.remotion_cache/npm"
          REMOTION_CACHE_DIR: "${{ github.workspace }}/.remotion_cache"
          PUPPETEER_CACHE_DIR: "/tmp/remotion-chromium"
          PLAYWRIGHT_BROWSERS_PATH: "/tmp/remotion-chromium"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          python3 -u "${{ steps.locate_job.outputs.job_file }}"

      - name: Package Chromium Cache & Final Outputs
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="${GITHUB_WORKSPACE}/${OUTPUT_ROOT_REL}"
          CHROMIUM_RUNTIME="${RUNNER_TEMP:-/tmp}/remotion-chromium"
          CHROMIUM_CACHE="${GITHUB_WORKSPACE}/${CACHE_ROOT_REL}/chromium"

          mkdir -p "${OUT_DIR}" "${CHROMIUM_CACHE}"

          if [ -d "${CHROMIUM_RUNTIME}" ] && [ -n "$(ls -A "${CHROMIUM_RUNTIME}" 2>/dev/null || true)" ]; then
            tar -cf "${CHROMIUM_CACHE}/chromium.tar" -C "${CHROMIUM_RUNTIME}" . || true
          fi

          shopt -s nullglob
          ARTIFACTS=(
            "${OUT_DIR}"/*_final.mp4
            "${OUT_DIR}"/*_cover.png
            "${OUT_DIR}"/*_render_report.json
            "${OUT_DIR}"/remotion_status.txt
          )

          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "Error: Tidak ada file output final ditemukan di ${OUT_DIR}." >&2
            exit 1
          fi

          ls -lh "${ARTIFACTS[@]}"

      - name: Upload Artifacts (Backup Download)
        uses: actions/upload-artifact@v4
        with:
          name: remotion-render-outputs-${{ steps.locate_job.outputs.job_hash }}-${{ github.run_number }}
          path: |
            outputs/*_final.mp4
            outputs/*_cover.png
            outputs/*_render_report.json
            outputs/remotion_status.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish MP4 & Cover to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('render-{0}-{1}', steps.locate_job.outputs.job_hash, github.run_number) }}
          name: Render ${{ steps.locate_job.outputs.job_hash }} (#${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            outputs/*_final.mp4
            outputs/*_cover.png
            outputs/*_render_report.json
            outputs/remotion_status.txt
